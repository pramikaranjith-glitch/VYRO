<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E35"/>
      <stop offset="100%" stop-color="#0a1322"/>
    </linearGradient>
    <pattern id="micro-weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none"/>
      <path d="M 0 8 L 8 0 L 16 8 L 8 16 Z" fill="none" stroke="#D5D9DF" stroke-width="0.8" opacity="0.3"/>
      <circle cx="8" cy="8" r="1.5" fill="#84958C" opacity="0.4"/>
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" stroke="#F4F1E9" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#fm-bg)"/>
  <rect width="400" height="400" fill="url(#micro-weave)"/>
  <!-- Macro radial focus vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#84958C" stop-opacity="0.1"/>
    <stop offset="70%" stop-color="#101E35" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#080e18" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="400" height="400" fill="url(#vignette)"/>
  <!-- Focus crosshair brackets in silver -->
  <g stroke="#D5D9DF" stroke-width="1" opacity="0.4" fill="none">
    <path d="M 180 190 L 190 190 L 190 180"/>
    <path d="M 220 190 L 210 190 L 210 180"/>
    <path d="M 180 210 L 190 210 L 190 220"/>
    <path d="M 220 210 L 210 210 L 210 220"/>
  </g>
</svg>
