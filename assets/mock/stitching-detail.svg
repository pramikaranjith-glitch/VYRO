<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E35"/>
      <stop offset="100%" stop-color="#0a1322"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sd-bg)"/>
  <!-- Fabric fold shadow -->
  <line x1="200" y1="0" x2="200" y2="400" stroke="#060c17" stroke-width="8" opacity="0.6"/>
  <!-- Flat-fell reinforced seam -->
  <line x1="188" y1="0" x2="188" y2="400" stroke="#F4F1E9" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.75"/>
  <line x1="212" y1="0" x2="212" y2="400" stroke="#F4F1E9" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.75"/>
  <!-- Bar-tack reinforcement lines -->
  <g stroke="#84958C" stroke-width="2.5" opacity="0.85" stroke-linecap="round">
    <line x1="160" y1="120" x2="240" y2="120"/>
    <line x1="160" y1="124" x2="240" y2="124"/>
    <line x1="160" y1="280" x2="240" y2="280"/>
    <line x1="160" y1="284" x2="240" y2="284"/>
  </g>
  <!-- Fine diagonal cross-stitch accents -->
  <g stroke="#D5D9DF" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="120" y1="190" x2="140" y2="210"/>
    <line x1="140" y1="190" x2="120" y2="210"/>
    <line x1="260" y1="190" x2="280" y2="210"/>
    <line x1="280" y1="190" x2="260" y2="210"/>
  </g>
</svg>
