  </defs>
  <rect width="400" height="500" fill="url(#mw-bg)"/>
  <!-- Minimalist architectural lines -->
  <line x1="0" y1="360" x2="400" y2="360" stroke="#D5D9DF" stroke-width="0.75" opacity="0.2"/>
  <line x1="280" y1="0" x2="280" y2="500" stroke="#D5D9DF" stroke-width="0.75" opacity="0.15"/>
  <line x1="120" y1="0" x2="120" y2="360" stroke="#D5D9DF" stroke-width="0.5" opacity="0.1"/>
