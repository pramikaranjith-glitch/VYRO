<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E35"/>
      <stop offset="100%" stop-color="#0d182b"/>
    </linearGradient>
    <pattern id="pd-weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="none" stroke="#D5D9DF" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#pd-bg)"/>
  <rect width="400" height="400" fill="url(#pd-weave)"/>
  <!-- Scrub pocket welt outline -->
  <g fill="none" stroke="#F4F1E9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Garment seam line -->
    <line x1="60" y1="80" x2="340" y2="80" stroke="#84958C" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Concealed pocket welt rectangle -->
    <rect x="80" y="140" width="240" height="180" rx="2" stroke="#F4F1E9" stroke-width="1.5" opacity="0.7"/>
    <!-- Zipper slot & bonded tape -->
    <rect x="110" y="160" width="180" height="12" rx="1" fill="#0b1424" stroke="#84958C" stroke-width="1" opacity="0.9"/>
    <!-- Zipper teeth track -->
    <line x1="120" y1="166" x2="270" y2="166" stroke="#D5D9DF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
    <!-- Matte black zip slider & minimalist cord pull -->
    <rect x="150" y="162" width="10" height="8" rx="1" fill="#D5D9DF" opacity="0.9"/>
    <line x1="155" y1="170" x2="155" y2="195" stroke="#F4F1E9" stroke-width="1.5" opacity="0.8"/>
    <circle cx="155" cy="197" r="2" fill="#F4F1E9" opacity="0.8"/>
    <!-- Bar-tack reinforcement at corner stress points -->
    <line x1="80" y1="135" x2="80" y2="145" stroke="#84958C" stroke-width="3" opacity="0.9"/>
    <line x1="320" y1="135" x2="320" y2="145" stroke="#84958C" stroke-width="3" opacity="0.9"/>
    <line x1="80" y1="315" x2="80" y2="325" stroke="#84958C" stroke-width="3" opacity="0.9"/>
    <line x1="320" y1="315" x2="320" y2="325" stroke="#84958C" stroke-width="3" opacity="0.9"/>
  </g>
</svg>
