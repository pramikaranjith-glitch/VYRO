<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sm1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E35"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <pattern id="sm1-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3" fill="#84958C" opacity="0.35"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke="#D5D9DF" stroke-width="0.7" opacity="0.2"/>
      <path d="M 0 12 L 24 12 M 12 0 L 12 24" stroke="#D5D9DF" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#sm1-bg)"/>
  <rect width="600" height="400" fill="url(#sm1-grid)"/>
  <!-- Abstract micro-encapsulation clusters -->
  <g fill="none" stroke="#F4F1E9" stroke-linecap="round">
    <circle cx="260" cy="180" r="42" stroke-width="1.5" opacity="0.5"/>
    <circle cx="260" cy="180" r="36" stroke="#84958C" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <circle cx="260" cy="180" r="12" fill="#84958C" opacity="0.2"/>
    <circle cx="340" cy="220" r="54" stroke-width="1.5" opacity="0.4"/>
    <circle cx="340" cy="220" r="46" stroke="#84958C" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="340" cy="220" r="16" fill="#84958C" opacity="0.15"/>
  </g>
</svg>
