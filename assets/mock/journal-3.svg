<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="j3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E35"/>
      <stop offset="100%" stop-color="#0c1729"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#j3-bg)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#D5D9DF" stroke-width="0.75" opacity="0.15"/>
  <!-- Modern architectural perspective corridor -->
  <g stroke="#D5D9DF" stroke-width="1" opacity="0.3" fill="none">
    <!-- Vanishing point perspective -->
    <line x1="20" y1="20" x2="300" y2="180"/>
    <line x1="580" y1="20" x2="300" y2="180"/>
    <line x1="20" y1="380" x2="300" y2="240"/>
    <line x1="580" y1="380" x2="300" y2="240"/>
    <!-- Back door frame -->
    <rect x="285" y="180" width="30" height="60" stroke="#84958C" stroke-width="1.2"/>
    <!-- Floor grid lines in perspective -->
    <line x1="160" y1="380" x2="295" y2="240"/>
    <line x1="440" y1="380" x2="305" y2="240"/>
    <!-- Ceiling recessed lighting strip -->
    <line x1="240" y1="75" x2="297" y2="180" stroke="#F4F1E9" stroke-width="2" opacity="0.7"/>
    <line x1="360" y1="75" x2="303" y2="180" stroke="#F4F1E9" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
